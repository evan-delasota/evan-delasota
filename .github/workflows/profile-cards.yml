name: Profile cards

# Builds the README's SVG cards and, from main only, publishes them to the
# `output` branch. Generated files never land on main, so its history stays
# readable; output is force-pushed as a single commit each run.
on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'cards/**'
      - 'package.json'
      - '.github/workflows/profile-cards.yml'

permissions:
  contents: read

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test
        run: npm test

      # GITHUB_TOKEN can read both accounts' public calendars, including private
      # work as anonymous counts once "Private contributions" is enabled on that
      # profile. The optional secrets add commit/PR/review detail; see cards/README.md.
      - name: Build
        run: node cards/build.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_STATS_TOKEN: ${{ secrets.WORK_STATS_TOKEN }}
          PERSONAL_STATS_TOKEN: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-cards
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to output branch
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: profile-cards
          path: dist

      - name: Push cards to the output branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init --quiet --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --quiet --message "Publish profile cards from ${GITHUB_SHA::7}"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" output
